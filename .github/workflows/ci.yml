name: Engineering checks and atlas
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atlas-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.8'
          enable-cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: sudo apt-get update -qq && sudo apt-get install -y graphviz
      - run: make bootstrap
      - run: make test build docs stress
      - run: uv build --out-dir .agent-local/packages
        env:
          UV_CACHE_DIR: .agent-local/uv-cache
      - uses: actions/upload-artifact@v4
        with:
          name: public-atlas
          path: dist
          retention-days: 7
  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: correctness
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: public-atlas
          path: dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          name: github-pages-${{ github.run_attempt }}
      - name: Wait for the uploaded Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for delay in 1 1 2 3 5 8; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" |
              jq -e --arg name "github-pages-$GITHUB_RUN_ATTEMPT" '.artifacts | any(.name == $name and (.expired | not))' >/dev/null; then
              exit 0
            fi
            sleep "$delay"
          done
          echo "::error::Pages artifact metadata did not become visible"
          exit 1
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
